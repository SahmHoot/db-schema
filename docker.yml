services:
  mysql:
    image: mysql:8.4
    container_name: sahmhoot-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: sahmhoot
      MYSQL_USER: sahmhoot_user
      MYSQL_PASSWORD: sahmhoot1!
      MYSQL_ROOT_PASSWORD: sahmhoot_root1!
      TZ: Asia/Seoul

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  redis:
    image: redis:7.4-alpine
    container_name: sahmhoot-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  mysql_data:
  redis_data:
